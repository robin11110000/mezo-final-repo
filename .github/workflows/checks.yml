name: Build and security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build:capital
      - name: Verify committed artifacts match compiler inputs
        run: git diff --exit-code -- exports/WorkingCapitalVault.json ui/src/lib/abis/WorkingCapitalVault.json
      - run: npm run test:security
      - run: npm ci --ignore-scripts
        working-directory: ui
      - run: npm run build
        working-directory: ui
